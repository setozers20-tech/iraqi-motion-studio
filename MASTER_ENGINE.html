<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iraqi Motion Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10131d;color:#fff;
 font-family:Arial,sans-serif;padding:20px
}
.app{max-width:1050px;margin:auto}
h1{font-size:25px;color:#b9a0ff}
p{color:#aeb5c8}
.panel{
 background:#1c2232;padding:16px;
 border-radius:14px;margin:15px 0
}
label{display:block;margin:12px 0 6px}
input,textarea,select,button{
 width:100%;padding:12px;border-radius:8px;
 border:1px solid #414b64;background:#293146;
 color:white;font-size:15px
}
textarea{min-height:75px;resize:vertical}
button{background:#7455db;border:0;font-weight:bold;margin-top:12px}
button.secondary{background:#39435a}
button:disabled{opacity:.5}
canvas{
 width:100%;max-height:540px;object-fit:contain;display:block;
 background:#080d1b;border-radius:12px;margin:auto
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.director-box{
 background:#131927;border-right:4px solid #9875ff;
 padding:12px;border-radius:8px;margin-top:12px;
 font-size:14px;line-height:1.6;color:#d6dcf0
}
.status{font-size:13px;color:#b9a0ff;margin-top:10px}
@media(max-width:550px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>IRAQI MOTION STUDIO</h1>
<p>AI Motion Graphics Director — Context, Language & Video Aware Engine</p>

<div class="panel">
<label>عنوان المشهد</label>
<input id="title" value="قصة تبدأ من هنا">

<label>النص التوضيحي</label>
<textarea id="subtitle">نحو تجربة بصرية مختلفة وأكثر احترافية</textarea>

<div class="row">
<div>
<label>قرار مهندس التصميم (التكوين والمكان)</label>
<select id="layoutMode">
<option value="auto">تلقائي (يقرر مهندس التصميم)</option>
<option value="lowerThird">عنوان سفلي لحماية المتحدث/المشهد</option>
<option value="split">تقسيم متوازن (نص + عنصر مرئي)</option>
<option value="hero">تركيز مركزي عالي التأثير</option>
<option value="card">بطاقة تحريرية مؤطرة</option>
</select>
</div>
<div>
<label>أسلوب الحركة</label>
<select id="motionMode">
<option value="auto">تلقائي حسب طبيعة الفكرة</option>
<option value="cinematic">انسياب سينمائي هادئ</option>
<option value="snappy">إيقاع حاسم ومباشر</option>
<option value="editorial">حضور تحريري متزن</option>
</select>
</div>
</div>

<div class="row">
<div>
<label>أبعاد المشهد</label>
<select id="aspectRatio">
<option value="16:9">16:9 (أفقي - يوتيوب وعروض)</option>
<option value="9:16">9:16 (عمودي - ريلز وتيك توك)</option>
<option value="1:1">1:1 (مربع - منشورات)</option>
</select>
</div>
<div>
<label>نمط الخلفية البصرية</label>
<select id="bgStyle">
<option value="grid">شبكة هندسية وهالة ضوئية</option>
<option value="waves">موجات منحنية وطبقات ضوئية</option>
<option value="particles">جسيمات متحركة وأشكال هندسية</option>
</select>
</div>
</div>

<div class="row">
<div>
<label>لون التصميم</label>
<input id="accent" type="color" value="#9875ff">
</div>
<div>
<label>مدة المشهد بالثواني</label>
<input id="duration" type="number" min="5" max="120" value="15">
</div>
</div>

<div class="row">
<div>
<label>إضافة مقطع فيديو للمشهد</label>
<input id="videoInput" type="file" accept="video/*">
</div>
<div>
<label>إضافة صورة</label>
<input id="imageInput" type="file" accept="image/*">
</div>
</div>

<label>إضافة ملف صوتي خارجي (اختياري)</label>
<input id="audioInput" type="file" accept="audio/*">

<div class="director-box" id="directorBrief">
جاري تحليل الفكرة والمشهد...
</div>
</div>

<div class="panel">
<canvas id="stage" width="1280" height="720"></canvas>

<div class="row">
<button id="play">▶ تشغيل المعاينة</button>
<button id="pause" class="secondary">Ⅱ إيقاف</button>
</div>

<button id="export">تسجيل وتصدير الفيديو WebM</button>
<div class="status" id="status">جاهز للمعاينة</div>
</div>
</div>

<video id="video" playsinline preload="auto" style="display:none"></video>
<audio id="audio" preload="auto"></audio>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("stage");
const ctx = canvas.getContext("2d");
const videoEl = $("video");
const audioEl = $("audio");

let photo = null;
let hasVideo = false;
let running = false;
let exporting = false;
let startTime = 0;
let elapsed = 0;
let raf = 0;
let audioURL = null;
let videoURL = null;

let W = canvas.width;
let H = canvas.height;

const particles = Array.from({length: 28}, (_, i) => ({
 rx: ((i * 73) % 100) / 100,
 ry: ((i * 41) % 100) / 100,
 r: 2.5 + (i % 4) * 1.4,
 speed: 0.25 + (i % 5) * 0.08,
 phase: i * 0.7
}));

function detectLanguageDirection(text){
 const arabicChars = (text.match(/[\u0600-\u06FF]/g) || []).length;
 const latinChars = (text.match(/[A-Za-z]/g) || []).length;
 if(arabicChars === 0 && latinChars > 0) return "ltr";
 if(latinChars > arabicChars * 1.5) return "ltr";
 return "rtl";
}

function analyzeIdea(title, subtitle, hasVid, hasImg, isPortrait){
 const combined = (title + " " + subtitle).trim();
 const wordsCount = combined.split(/\s+/).filter(Boolean).length;
 const dir = detectLanguageDirection(combined);

 const urgentPattern = /(عاجل|تنبيه|خطير|مهم|سر|تحذير|احذر|لا تفوت|الآن|urgent|warning|alert|breaking|important|stop)/i;
 const questionPattern = /[؟?]|(لماذا|كيف|متى|أين|هل|what|why|how|when|where|who)/i;
 const statsPattern = /(\d+%|\d+\s*(مليون|ألف|سنة|يوم|خطوة|سبب|million|thousand|years|days|steps))/i;

 let importance = "medium";
 let intent = "editorial";
 if(urgentPattern.test(combined) || (title.trim().length > 0 && title.trim().split(/\s+/).length <= 3)){
  importance = "high";
  intent = urgentPattern.test(combined) ? "alert" : "hook";
 }else if(questionPattern.test(combined)){
  importance = "medium";
  intent = "question";
 }else if(statsPattern.test(combined)){
  importance = "high";
  intent = "data";
 }else if(wordsCount > 24){
  importance = "detailed";
  intent = "narrative";
 }

 const chosenLayout = $("layoutMode").value !== "auto"
  ? $("layoutMode").value
  : hasVid
    ? "lowerThird"
    : (hasImg && !isPortrait)
      ? "split"
      : (importance === "high" && wordsCount <= 12)
        ? "hero"
        : "card";

 const chosenMotion = $("motionMode").value !== "auto"
  ? $("motionMode").value
  : (intent === "alert" || intent === "hook" || intent === "data")
    ? "snappy"
    : (intent === "question" || intent === "narrative")
      ? "cinematic"
      : "editorial";

 const titleScale = importance === "high" ? 1.16 : importance === "detailed" ? 0.90 : 1.0;
 const subScale = wordsCount > 20 ? 0.85 : importance === "high" ? 1.04 : 1.0;

 const langLabel = dir === "ltr" ? "نص أجنبي (يسار ← يمين)" : "نص عربي (يمين ← يسار)";
 const intentLabel = {
  alert: "تنبيه/تركيز حاسم",
  hook: "افتتاحية خاطفة للانتباه",
  question: "تساؤل تفاعلي",
  data: "معلومة/إحصاء بارز",
  narrative: "سرد تفصيلي",
  editorial: "طرح تحريري متزن"
 }[intent];

 const layoutLabel = {
  lowerThird: "عنوان سفلي لحماية منطقة المتحدث والفيديو",
  split: "تقسيم متوازن بين النص والصورة",
  hero: "تركيز مركزي عالي التأثير",
  card: "بطاقة تحريرية منظمة"
 }[chosenLayout];

 const motionLabel = {
  snappy: "حركة حاسمة وسريعة الاستجابة",
  cinematic: "انسياب سينمائي هادئ",
  editorial: "حضور تحريري متزن"
 }[chosenMotion];

 const summary = `مهندس التصميم: ${langLabel} • ${intentLabel} • القرار: ${layoutLabel} مع ${motionLabel}.`;

 return {
  dir,
  importance,
  intent,
  chosenLayout,
  chosenMotion,
  titleScale,
  subScale,
  summary
 };
}

function applyAspectRatio(){
 const ratio = $("aspectRatio").value;
 if(ratio === "9:16"){
  canvas.width = 720;
  canvas.height = 1280;
 }else if(ratio === "1:1"){
  canvas.width = 1080;
  canvas.height = 1080;
 }else{
  canvas.width = 1280;
  canvas.height = 720;
 }
 W = canvas.width;
 H = canvas.height;
}

function duration(){
 return Math.max(5,Math.min(120,Number($("duration").value)||15));
}

function ease(t, mode){
 t=Math.max(0,Math.min(1,t));
 if(mode === "snappy"){
  return 1-Math.pow(1-t,4);
 }
 if(mode === "cinematic"){
  return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
 }
 return 1-Math.pow(1-t,3);
}

function drawStyledText(text,x,y,size,color,dir,align="center",weight="bold"){
 ctx.font=weight+" "+size+"px Arial";
 ctx.textAlign=align;
 ctx.direction=dir;
 ctx.fillStyle=color;
 ctx.fillText(text,x,y);
}

function drawVideoLayer(t,color){
 if(!hasVideo || videoEl.readyState < 2) return;
 const vw = videoEl.videoWidth || W;
 const vh = videoEl.videoHeight || H;
 const coverScale = Math.max(W/vw, H/vh);
 const sw = vw * coverScale;
 const sh = vh * coverScale;
 const vx = (W - sw) / 2;
 const vy = (H - sh) / 2;

 ctx.save();
 ctx.drawImage(videoEl, vx, vy, sw, sh);

 // Subtle contrast scrim so typography and graphics stay crisp over any video
 const grad = ctx.createLinearGradient(0, H*0.35, 0, H);
 grad.addColorStop(0, "rgba(8,13,27,0.12)");
 grad.addColorStop(0.65, "rgba(8,13,27,0.45)");
 grad.addColorStop(1, "rgba(8,13,27,0.82)");
 ctx.fillStyle = grad;
 ctx.fillRect(0, 0, W, H);

 ctx.strokeStyle = color + "45";
 ctx.lineWidth = 2;
 ctx.strokeRect(W*0.03, H*0.03, W*0.94, H*0.94);
 ctx.restore();
}

function drawBackground(t,color,motionMode){
 if(hasVideo){
  drawVideoLayer(t,color);
  return;
 }

 const style = $("bgStyle").value;
 const g=ctx.createLinearGradient(0,0,W,H);
 g.addColorStop(0,"#10182c");
 g.addColorStop(1,"#080b16");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 const pulse=1+Math.sin(t*1.5)*.06;
 const glow=ctx.createRadialGradient(
  W*.5,H*.45,20,W*.5,H*.45,Math.max(W,H)*.42*pulse
 );
 glow.addColorStop(0,color+"30");
 glow.addColorStop(1,"transparent");
 ctx.fillStyle=glow;
 ctx.fillRect(0,0,W,H);

 if(style === "grid"){
  ctx.save();
  ctx.globalAlpha=.12;
  ctx.strokeStyle=color;
  ctx.lineWidth=1;
  const step = Math.max(48, Math.round(Math.min(W,H) / 11));
  for(let x=0;x<=W;x+=step){
   ctx.beginPath();
   ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y=0;y<=H;y+=step){
   ctx.beginPath();
   ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  ctx.restore();
 }else if(style === "waves"){
  ctx.save();
  for(let layer=0;layer<3;layer++){
   ctx.beginPath();
   const baseY = H*(0.32 + layer*0.18);
   for(let x=0;x<=W+20;x+=24){
    const y = baseY + Math.sin(x*0.008 + t*(1.2+layer*0.3) + layer)*28;
    if(x===0)ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
   }
   ctx.lineTo(W,H);
   ctx.lineTo(0,H);
   ctx.closePath();
   ctx.fillStyle = color + (layer===0 ? "18" : layer===1 ? "12" : "0c");
   ctx.fill();
  }
  ctx.restore();
 }else if(style === "particles"){
  ctx.save();
  particles.forEach((p, idx)=>{
   const px = ((p.rx * W) + Math.sin(t*p.speed + p.phase)*26 + W) % W;
   const py = ((p.ry * H) + Math.cos(t*p.speed*0.9 + p.phase)*26 + H) % H;
   ctx.globalAlpha = 0.22 + 0.14*Math.sin(t*2 + idx);
   ctx.fillStyle = idx % 3 === 0 ? "#ffffff" : color;
   ctx.beginPath();
   ctx.arc(px, py, p.r * (Math.min(W,H)/720), 0, Math.PI*2);
   ctx.fill();
  });
  ctx.strokeStyle = color + "28";
  ctx.lineWidth = 2;
  ctx.strokeRect(W*0.05, H*0.06, W*0.90, H*0.88);
  ctx.restore();
 }
}

function drawImageLayer(t, layout, isPortrait, dir, motionMode){
 if(!photo)return;

 const durFactor = motionMode === "snappy" ? 0.65 : motionMode === "cinematic" ? 1.2 : 0.95;
 const progress=ease(t/durFactor, motionMode);
 const scale=1.04-progress*.04;
 const iw=photo.width,ih=photo.height;

 let boxW, boxH, cx, cy;
 if(layout === "lowerThird"){
  boxW = W*0.18;
  boxH = H*0.14;
  cx = dir === "ltr" ? W*0.15 : W*0.85;
  cy = H*0.79;
 }else if(layout === "split" && !isPortrait){
  boxW = W*0.36;
  boxH = H*0.48;
  cx = dir === "ltr" ? W*0.74 : W*0.26;
  cy = H*0.48;
 }else if(isPortrait){
  boxW = W*0.60;
  boxH = H*0.24;
  cx = W*0.5;
  cy = H*0.64;
 }else{
  boxW = W*0.34;
  boxH = H*0.42;
  cx = dir === "ltr" ? W*0.75 : W*0.25;
  cy = H*0.46;
 }

 const fit=Math.min(boxW/iw, boxH/ih);
 const sw=iw*fit*scale, sh=ih*fit*scale;
 const x=cx-sw/2;
 const y=cy-sh/2;

 ctx.save();
 ctx.globalAlpha=ease(t/(durFactor*0.75), motionMode);
 ctx.shadowColor="#000";
 ctx.shadowBlur=30;
 ctx.drawImage(photo,x,y,sw,sh);
 ctx.restore();
}

function draw(t){
 const color=$("accent").value;
 const title=$("title").value;
 const subtitle=$("subtitle").value;
 const isPortrait = H > W;
 const hasImg = !!photo;

 const plan = analyzeIdea(title, subtitle, hasVideo, hasImg, isPortrait);
 $("directorBrief").textContent = plan.summary;

 const introDur = plan.chosenMotion === "snappy" ? 0.55 : plan.chosenMotion === "cinematic" ? 1.15 : 0.85;
 const intro=ease(t/introDur, plan.chosenMotion);
 const exit=1-ease((t-duration()+.65)/.65, plan.chosenMotion);
 const alpha = Math.max(0, Math.min(1, intro * exit));

 ctx.clearRect(0,0,W,H);
 drawBackground(t,color,plan.chosenMotion);

 const movement=(1-intro)*(plan.chosenMotion === "snappy" ? 30 : 52);

 if(plan.chosenLayout === "lowerThird"){
  const barW = W*0.88;
  const barH = Math.max(132, H*0.19);
  const barX = W*0.06;
  const barY = H*0.71 + movement*0.35;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "rgba(11,16,32,0.88)";
  ctx.fillRect(barX, barY, barW, barH);

  ctx.fillStyle = color;
  if(plan.dir === "ltr"){
   ctx.fillRect(barX, barY, 8, barH);
  }else{
   ctx.fillRect(barX + barW - 8, barY, 8, barH);
  }

  drawImageLayer(t, plan.chosenLayout, isPortrait, plan.dir, plan.chosenMotion);

  const tx = hasImg
   ? (plan.dir === "ltr" ? W*0.54 : W*0.44)
   : W*0.5;
  const maxW = hasImg ? W*0.58 : W*0.78;
  const tSize = Math.round((isPortrait ? 30 : 35) * plan.titleScale);
  const sSize = Math.round((isPortrait ? 19 : 22) * plan.subScale);

  drawStyledText(title, tx, barY + barH*0.38, tSize, "#ffffff", plan.dir, "center");
  drawStyledText(subtitle, tx, barY + barH*0.56, sSize, "#d5dcf0", plan.dir, "center", "normal");
  ctx.restore();
 }else{
  if(plan.chosenLayout === "card"){
   ctx.save();
   ctx.globalAlpha = alpha * 0.72;
   ctx.fillStyle = "rgba(20,28,47,0.85)";
   ctx.strokeStyle = color + "88";
   ctx.lineWidth = 2;
   const padX = W*0.06;
   const padY = H*0.12;
   ctx.fillRect(padX, padY, W - padX*2, H - padY*2);
   ctx.strokeRect(padX, padY, W - padX*2, H - padY*2);
   ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.fillRect(W*.08,H*.24,Math.min(W*.84,t*(W*0.58)),5);
  ctx.restore();

  drawImageLayer(t, plan.chosenLayout, isPortrait, plan.dir, plan.chosenMotion);

  let textX = W*.5;
  let textY = H*.42;
  let titleSize = (isPortrait ? 48 : 64) * plan.titleScale;
  let subSize = (isPortrait ? 25 : 29) * plan.subScale;
  let maxWidth = W*.80;

  if(plan.chosenLayout === "split" && hasImg && !isPortrait){
   textX = plan.dir === "ltr" ? W*0.28 : W*0.72;
   textY = H*.44;
   titleSize = 46 * plan.titleScale;
   maxWidth = W*.42;
  }else if(hasImg && isPortrait){
   textY = H*.33;
   maxWidth = W*.82;
  }

  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(0,movement);

  drawStyledText(title, textX, textY, Math.round(titleSize), "#ffffff", plan.dir, "center");

  ctx.font=Math.round(subSize)+"px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="top";
  ctx.direction=plan.dir;
  ctx.fillStyle="#d0d7ec";

  const words=subtitle.split(/\s+/).filter(Boolean);
  let line="",lines=[];
  for(const word of words){
   const test=line?line+" "+word:word;
   if(ctx.measureText(test).width>maxWidth&&line){
    lines.push(line);line=word;
   }else line=test;
  }
  if(line)lines.push(line);

  lines.slice(0,4).forEach((item,i)=>{
   ctx.fillText(item,textX,textY + titleSize*0.75 + i*(subSize*1.35));
  });

  ctx.restore();
 }

 // Progress indicator
 const progress=Math.min(1,t/duration());
 ctx.fillStyle="#ffffff30";
 ctx.fillRect(W*.08,H*.91,W*.84,5);
 ctx.fillStyle=color;
 ctx.fillRect(W*.08,H*.91,W*.84*progress,5);

 drawStyledText(
  "IRAQI MOTION STUDIO",
  W*.5,H*.96,17,"#8993ad","ltr","center","normal"
 );
}

function frame(){
 if(!running)return;
 elapsed=(performance.now()-startTime)/1000;
 if(elapsed>=duration()){
  elapsed=duration();
  running=false;
  draw(elapsed);
  if(audioEl.src)audioEl.pause();
  if(hasVideo)videoEl.pause();
  $("status").textContent="انتهى المشهد";
  return;
 }
 if(hasVideo && videoEl.readyState >= 2){
  const targetVidTime = elapsed % Math.max(0.1, videoEl.duration || duration());
  if(Math.abs(videoEl.currentTime - targetVidTime) > 0.18){
   videoEl.currentTime = targetVidTime;
  }
 }
 draw(elapsed);
 raf=requestAnimationFrame(frame);
}

function play(){
 if(running)return;
 if(elapsed>=duration())elapsed=0;
 running=true;
 startTime=performance.now()-elapsed*1000;
 if(audioEl.src){
  audioEl.currentTime=elapsed;
  audioEl.play().catch(()=>{});
 }
 if(hasVideo){
  videoEl.currentTime=elapsed % Math.max(0.1, videoEl.duration || duration());
  videoEl.play().catch(()=>{});
 }
 $("status").textContent="المشهد قيد التشغيل";
 raf=requestAnimationFrame(frame);
}

function pause(){
 running=false;
 cancelAnimationFrame(raf);
 if(audioEl.src)audioEl.pause();
 if(hasVideo)videoEl.pause();
 $("status").textContent="تم إيقاف المعاينة";
}

$("aspectRatio").addEventListener("change",()=>{
 applyAspectRatio();
 draw(elapsed);
});

$("videoInput").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(!file)return;
 pause();
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(file);
 videoEl.src=videoURL;
 videoEl.muted=true;
 videoEl.load();
 videoEl.onloadeddata=()=>{
  hasVideo=true;
  elapsed=0;
  videoEl.currentTime=0;
  draw(0);
  $("status").textContent="تم تحميل الفيديو وحلل مهندس التصميم المشهد";
 };
});

$("imageInput").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(!file)return;
 const url=URL.createObjectURL(file);
 const img=new Image();
 img.onload=()=>{
  if(photo&&photo._url)URL.revokeObjectURL(photo._url);
  photo=img;
  photo._url=url;
  draw(elapsed);
 };
 img.onerror=()=>URL.revokeObjectURL(url);
 img.src=url;
});

$("audioInput").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(!file)return;
 pause();
 if(audioURL)URL.revokeObjectURL(audioURL);
 audioURL=URL.createObjectURL(file);
 audioEl.src=audioURL;
 audioEl.load();
 elapsed=0;
 draw(0);
 $("status").textContent="تم تحميل الصوت";
});

["title","subtitle","layoutMode","motionMode","bgStyle","accent","duration"].forEach(id=>{
 $(id).addEventListener("input",()=>draw(elapsed));
 $(id).addEventListener("change",()=>draw(elapsed));
});

$("play").onclick=play;
$("pause").onclick=pause;

$("export").onclick=async()=>{
 if(exporting)return;
 if(!window.MediaRecorder||
    !canvas.captureStream||
    !HTMLCanvasElement.prototype.captureStream){
  $("status").textContent="المتصفح لا يدعم تسجيل الفيديو";
  return;
 }

 if(!audioEl.src){
  $("status").textContent="أضف ملفاً صوتياً أولاً";
  return;
 }

 try{
  pause();
  exporting=true;
  $("export").disabled=true;
  elapsed=0;
  if(hasVideo)videoEl.currentTime=0;
  draw(0);

  const videoStream=canvas.captureStream(30);
  const audioStream=audioEl.captureStream?
    audioEl.captureStream():
    audioEl.mozCaptureStream?.();

  if(!audioStream||!audioStream.getAudioTracks().length){
   throw new Error("تعذر التقاط الصوت من المتصفح");
  }

  const stream=new MediaStream([
   ...videoStream.getVideoTracks(),
   ...audioStream.getAudioTracks()
  ]);

  const types=[
   "video/webm;codecs=vp9,opus",
   "video/webm;codecs=vp8,opus",
   "video/webm"
  ];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t));
  const recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
  const chunks=[];

  recorder.ondataavailable=e=>{
   if(e.data.size)chunks.push(e.data);
  };

  recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:recorder.mimeType||"video/webm"});
   const url=URL.createObjectURL(blob);
   const a=document.createElement("a");
   a.href=url;
   a.download="iraqi-motion-studio.webm";
   a.click();
   setTimeout(()=>URL.revokeObjectURL(url),60000);
   stream.getTracks().forEach(t=>t.stop());
   exporting=false;
   $("export").disabled=false;
   $("status").textContent="اكتمل التصدير
    ";
  };

  recorder.start();
  audioEl.currentTime=0;
  await audioEl.play();
  if(hasVideo)await videoEl.play().catch(()=>{});

  const exportStart=performance.now();
  running=true;
  startTime=exportStart;
  $("status").textContent="جاري تسجيل الفيديو...";

  function exportFrame(){
   if(!exporting)return;
   elapsed=(performance.now()-exportStart)/1000;
   draw(Math.min(elapsed,duration()));
   if(elapsed<duration()&&!audioEl.ended){
    requestAnimationFrame(exportFrame);
   }else{
    running=false;
    audioEl.pause();
    if(hasVideo)videoEl.pause();
    recorder.stop();
   }
  }
  requestAnimationFrame(exportFrame);

 }catch(error){
  exporting=false;
  $("export").disabled=false;
  $("status").textContent="تعذر التصدير: "+error.message;
 }
};

applyAspectRatio();
draw(0);
</script>
</body>
</html>
